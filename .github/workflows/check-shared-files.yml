name: ci

on:
  push:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync-shared-files.sh --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install litmus
        run: pip install git+https://github.com/OrenSegal/litmus.git
      - name: Gate signal-scout skill-behavior evals against baseline
        run: python3 -m litmus.cli gate evals/signal-scout --baseline evals/signal-scout/baseline.json
